locale                   : "en-US"
site_theme               : "default"
title                    : "Seyed Milad Hatamlee"
title_separator          : "-"
name                     : &name "Seyed Milad Hatamlee"
description              : &description "Seyed Milad Hatamlee is a computational materials scientist in Palo Alto, California, researching molecular simulation, thermodynamics, and nanoscale transport."
url                      : "https://miladhtml.online"
baseurl                  : ""
repository               : "miladhtml/miladhatamlee.github.io"

author:
  avatar           : "profile.png"
  name             : "Seyed Milad Hatamlee"
  bio              : "Computational materials scientist | Molecular simulation, thermodynamics, and nanoscale transport. Research in molecular simulations, nanoconfined fluids, CO2 transport, and phase behavior."
  location         : "Palo Alto, California, USA"
  employer         : ""
  email            : "miladhtml2@gmail.com"

  googlescholar    : "https://scholar.google.com/citations?hl=en&user=vp2BeBkAAAAJ"
  orcid            : "https://orcid.org/0000-0003-4693-0476"
  github           : "miladhtml"
  linkedin         : "seyed-milad-hatamlee-3a52aa1a7"

# Publication Category - The following the list of publication categories and their headings
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'    
  conferences:
    title: 'Conference Papers'

# Site Settings
teaser                   :  # filename of teaser fallback teaser image placed in /images/ for social media previews
breadcrumbs              : false # true, false (default)
words_per_minute         : 160
future                   : false
read_more                : "disabled" # if enabled, adds "Read more" links to excerpts
talkmap_link             : false      #change to true to add link to talkmap on talks page
comments:
  provider               : # false (default), "disqus", "discourse", "facebook", "google-plus", "staticman", "custom"
  disqus:
    shortname            :
  discourse:
    server               : # https://meta.discourse.org/t/embedding-discourse-comments-via-javascript/31963 , e.g.: meta.discourse.org
  facebook:
    appid                :
    num_posts            : # 5 (default)
    colorscheme          : # "light" (default), "dark"
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages" # "master", "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601" # "iso8601" (default), "timestamp-seconds", "timestamp-milliseconds"
atom_feed:
  hide                   : true     # change to true to hide the RSS feed in the footer
  path                   : # blank (default) uses feed.xml


# SEO Related
google_site_verification : "a7XYrXmrU7MzBFPvHMEnlHOWLVws7sYo6FMmUy_cA0o"
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :


# Social Sharing
twitter:
  username               : &twitter
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :  # Social media default site image
og_description           :  # Social media default site image description
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type: Person
  name: "Seyed Milad Hatamlee"
  alternate_names:
    - "Milad Hatamlee"
    - "Seyed Milad Hatam-Lee"
  links:
    - "https://scholar.google.com/citations?user=vp2BeBkAAAAJ"
    - "https://orcid.org/0000-0003-4693-0476"
    - "https://github.com/miladhtml"
    - "https://www.linkedin.com/in/seyed-milad-hatamlee-3a52aa1a7/"


# Analytics
analytics:
  provider               : "google-analytics-4"
  google:
    tracking_id          : "G-1JP74Z8RV1"


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  # Academic Pages sample documents; keep them out of the published site.
  - files/paper1.pdf
  - files/paper2.pdf
  - files/paper3.pdf
  - files/slides1.pdf
  - files/slides2.pdf
  - files/slides3.pdf
  - files/bibtex1.bib
  - _pages/teaching.md
  - _posts
  - _drafts
  - _publications
  - _talks
  - _teaching
  - _portfolio
  - markdown_generator
  - talkmap
  - talkmap.ipynb
  - talkmap.py
  - CONTRIBUTING.md
  - docs
  - _pages/collection-archive.html
  - _pages/year-archive.html
  - _pages/portfolio.html
  - _pages/terms.md
  - _pages/teaching.html
  - _pages/page-archive.html
  - _pages/markdown.md
  - _pages/talkmap.html
  - _pages/non-menu-page.md
  - _pages/cv-json.md
  - _pages/publications.html
  - _pages/category-archive.html
  - _pages/tag-archive.html
  - _pages/archive-layout-with-content.md
  - _pages/talks.html
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# These settings control the types of collections used by the template
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/


# These settings control how pages and collections are included in the site
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
# paginate: 5 # amount of posts to show
# paginate_path: /page:num/
timezone: Etc/UTC # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# Archives
#  Type
#  - GitHub Pages compatible archive pages built with Liquid ~> type: liquid (default)
#  - Jekyll Archives plugin archive pages ~> type: jekyll-archives
#  Path (examples)
#  - Archive page should exist at path when using Liquid method or you can
#    expect broken links (especially with breadcrumbs enabled)
#  - <base_path>/tags/my-awesome-tag/index.html ~> path: /tags/
#  - <base_path/categories/my-awesome-category/index.html ~> path: /categories/
#  - <base_path/my-awesome-category/index.html ~> path: /
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
# https://github.com/jekyll/jekyll-archives
# jekyll-archives:
#   enabled:
#     - categories
#     - tags
#   layouts:
#     category: archive-taxonomy
#     tag: archive-taxonomy
#   permalinks:
#     category: /categories/:name/
#     tag: /tags/:name/


# HTML Compression
# - https://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
